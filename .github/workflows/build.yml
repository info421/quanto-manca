name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepara APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk QuantoManca.apk
          echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.0.${{ github.run_number }}\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: QuantoManca
          path: QuantoManca.apk

      - name: Pubblica nella pagina Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest QuantoManca.apk version.json \
            --title "Quanto manca - versione 1.0.${{ github.run_number }}" \
            --notes "Scarica QuantoManca.apk dal telefono e installalo."
